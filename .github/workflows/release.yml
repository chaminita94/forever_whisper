name: Release addon
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: ForeverGithub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/test_whisper.py
      - name: Validate release configuration
        env:
          CF_API_TOKEN: ${{ secrets.FWHISPER }}
        run: |
          [[ -n "$CF_API_TOKEN" ]] || { echo 'Set the FWHISPER secret in the ForeverGithub environment.'; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          for toc in ForeverWhisper*.toc; do
            grep -Fxq "## Version: $version" "$toc" || { echo "Version mismatch in $toc"; exit 1; }
          done
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.FWHISPER }}
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverWhisper-release
          path: .release/*.zip
